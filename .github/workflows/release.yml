name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build-vsix.yml

  publish:
    name: Publish to Marketplace
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: marketplace
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix

      - name: Publish every platform build
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath vsix/*.vsix

      - name: Attach VSIX files to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: vsix/*.vsix
          generate_release_notes: true
